<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>screenshare</title>
    <style>
      body { font: 14px/1.5 system-ui, sans-serif; margin: 24px; }
      button, select, input { font: inherit; }
      button { padding: 6px 12px; }
      input[type='number'] { width: 80px; }
      section { margin-bottom: 16px; }
      #sources { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
      #sources button { display: flex; flex-direction: column; align-items: center; width: 180px; padding: 6px; }
      #sources img { width: 100%; }
      #sources span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
      #remote-screen { width: 100%; max-height: 70vh; background: #000; }
      #remote-camera, #local-camera { width: 240px; background: #000; }
      #local-camera.mirrored { transform: scaleX(-1); }
      #ptt-hold { padding: 24px 48px; touch-action: none; user-select: none; -webkit-user-select: none; }
      #ptt-hold.held { background: #2a7; color: #fff; }
      #stats, #log { font: 12px ui-monospace, monospace; white-space: pre-wrap; color: #666; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <p>Running in: <strong id="env"></strong></p>

    <section id="lobby" hidden>
      <button id="create">New room</button>
    </section>

    <section id="room" hidden>
      <p>Invite link: <a id="link"></a> <button id="copy">Copy</button></p>
      <p>State: <strong id="state">not joined</strong></p>
      <button id="join">Join</button>
      <label><input type="checkbox" id="mute" disabled /> Mute</label>
      <button id="leave" disabled>Leave</button>
    </section>

    <section id="voice" hidden>
      <label><input type="radio" name="voice-mode" value="open" checked /> Open mic</label>
      <label><input type="radio" name="voice-mode" value="push-to-talk" /> Push-to-talk</label>
      <span id="ptt-desktop" hidden>
        · Key: <strong id="ptt-key">none</strong>
        <button id="ptt-bind">Set key…</button>
        <button id="ptt-permission" hidden>Grant Accessibility access</button>
      </span>
      <p><button id="ptt-hold" hidden>Hold to talk</button></p>
      <p>You: <strong id="voice-local">–</strong> · Them: <strong id="voice-remote">–</strong></p>
    </section>

    <section id="screen" hidden>
      <button id="share">Share screen…</button>
      <button id="stop-share" disabled>Stop sharing</button>
      <label><input type="checkbox" id="share-audio" checked /> Include system audio</label>
      <div id="sources"></div>
      <p>
        <select id="preset"></select>
        <select id="codec">
          <option>auto</option>
          <option>video/H264</option>
          <option>video/VP8</option>
          <option>video/VP9</option>
          <option>video/AV1</option>
        </select>
        <select id="mode">
          <option value="detail">detail (text)</option>
          <option value="motion">motion (video)</option>
        </select>
        <input id="height" type="number" placeholder="native" /> p
        <input id="fps" type="number" /> fps
        <input id="bitrate" type="number" /> kbps
      </p>
    </section>

    <section id="camera" hidden>
      <button id="camera-toggle">Camera on</button>
      <button id="camera-switch" disabled>Switch camera</button>
      <select id="camera-device"></select>
      <div><video id="local-camera" autoplay playsinline muted hidden></video></div>
    </section>

    <section id="remote" hidden>
      <video id="remote-screen" autoplay playsinline muted hidden></video>
      <video id="remote-camera" autoplay playsinline muted hidden></video>
      <p>
        <label>Voice <input type="range" id="voice-volume" min="0" max="1" step="0.05" value="1" /></label>
        <label>Show <input type="range" id="show-volume" min="0" max="1" step="0.05" value="1" /></label>
      </p>
    </section>

    <pre id="stats"></pre>
    <div id="log"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
